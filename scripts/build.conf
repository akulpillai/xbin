# Inputs for building the self-contained `bind:latest` base image -- the heavy
# Binary Ninja + Ghidra + QEMU + PySR stack that the four Morpheus plugins
# extend. Fill these in once; CLI args to build_bind_base.sh override them.
# A leading ~ is expanded.
#
#   binja dir    : a Binary Ninja install DIRECTORY, or a .zip whose top level
#                  contains a binaryninja/ folder. Baked into the image.
#   license path : path to your Binary Ninja license.dat. Baked into the image.

binja dir: "/evaldisk/akul/integration/binaryninja_linux_stable_ultimate.zip"
license path: "/evaldisk/akul/integration/docker_build/license.dat"
